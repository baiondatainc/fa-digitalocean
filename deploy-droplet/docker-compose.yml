# Full Future Advisor + Chatbot stack on a single DigitalOcean droplet.
#
# Pulls every application image from the DO container registry
# (registry.digitalocean.com/future-advisor/<name>:<tag>) and runs the
# support services (Postgres/TimescaleDB, Redis, Neo4j, MongoDB, Meilisearch)
# locally. A Caddy proxy fronts the web + API + LibreChat on 80/443.
#
# Images expected on the registry (push with future-advisor/scripts/push-docker-do.sh
# and LibreChat / synthea-neo4j build-and-push.sh):
#   web, api, forecast-py, forecast-agent, ingest-worker,
#   live-agent, synthea-agent, librechat
# (The `probe` image on the registry is a one-off diagnostic — not wired here.)
#
# Bring-up:
#   bash install-full.sh
#
# All tunables and secrets come from .env (see .env.full.example). Only the
# Caddy proxy and the LibreChat UI (optional direct port) bind host ports.

name: future-advisor-full

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Image refs come from ${REGISTRY}/<name>:${<NAME>_TAG | IMAGE_TAG | latest}
# per service. Docker Compose does not interpolate inside YAML anchors, so the
# registry prefix is inlined into every `image:` line rather than aliased.

# Shared DB URL used by API, forecast-py, ingest, live-agent, forecast-agent.
x-database-url: &database-url "postgresql://${POSTGRES_USER:?set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@timescaledb:5432/${POSTGRES_DB:?set POSTGRES_DB in .env}"

# forecast-agent shares the exact same env across agent-api and agent-scheduler.
x-agent-env: &agent-env
  DATABASE_URL: *database-url
  AGENT_DATABASE_URL_RO: *database-url
  AGENT_DATABASE_URL_RW: *database-url
  REDIS_URL: redis://redis:6379/0
  LLM_API_KEY: ${AGENT_LLM_API_KEY:-}
  LLM_MODEL: ${AGENT_LLM_MODEL:-claude-sonnet-4-20250514}
  LLM_BASE_URL: ${AGENT_LLM_BASE_URL:-https://api.anthropic.com}
  LLM_MAX_TOKENS: "600"
  DRIVER_UPDATED_CHANNEL: fa.driver.updated
  AGENT_DEBOUNCE_SECONDS: "30"
  AGENT_MIN_GAP_SECONDS: "900"
  AGENT_FALLBACK_SECONDS: "900"
  AGENT_ENVIRONMENTS: ${AGENT_ENVIRONMENTS:-dubai}
  AGENT_API_TOKEN: ${AGENT_API_TOKEN:?set AGENT_API_TOKEN in .env}
  AGENT_API_PORT: "8020"
  AGENT_MODEL_ID: ${AGENT_MODEL_ID:-dxb-revenue}
  AGENT_FOCUS_YEAR: ${AGENT_FOCUS_YEAR:-2027}
  AGENT_ACTUAL_YEAR: ${AGENT_ACTUAL_YEAR:-2025}
  AGENT_PROJECTION_YEARS: ${AGENT_PROJECTION_YEARS:-2026,2027,2028,2029,2030}
  AGENT_DRIFT_THRESHOLD_PCT: "3"
  NEWS_MAX_AGE_HOURS: "48"
  MARKET_NEWS_FEEDS: ${MARKET_NEWS_FEEDS:-}

services:

  # ──────────────────────────── data stores ─────────────────────────────

  timescaledb:
    image: timescale/timescaledb-ha:pg16
    container_name: fa-timescaledb
    restart: unless-stopped
    command: ["postgres", "-c", "max_locks_per_transaction=1024"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - timescale_data:/home/postgres/pgdata/data
    shm_size: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 4g
    networks: [fa_internal]
    logging: *logging

  redis:
    image: redis:7-alpine
    container_name: fa-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "1gb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    mem_limit: 1g
    networks: [fa_internal]
    logging: *logging

  neo4j:
    image: neo4j:5.26-community
    container_name: fa-neo4j
    restart: unless-stopped
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
      - NEO4J_server_memory_heap_initial__size=1G
      - NEO4J_server_memory_heap_max__size=4G
      - NEO4J_server_memory_pagecache__size=4G
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*
      - NEO4J_server_config_strict__validation_enabled=false
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - ./neo4j_export:/import:ro
    ports:
      - "10.141.5.182:7474:7474"
      - "10.141.5.182:7687:7687"
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "${NEO4J_PASSWORD}", "RETURN 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 40s
    mem_limit: 6g
    networks: [fa_internal]
    logging: *logging

  mongodb:
    image: mongo:7
    container_name: fa-mongodb
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1}).ok"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [fa_internal]
    logging: *logging

  meilisearch:
    image: getmeili/meilisearch:v1.12.3
    container_name: fa-meilisearch
    restart: unless-stopped
    environment:
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:?set MEILI_MASTER_KEY in .env}
      - MEILI_NO_ANALYTICS=true
    volumes:
      - meili_data:/meili_data
    networks: [fa_internal]
    logging: *logging

  # ─────────────────────────── application services ─────────────────────

  api:
    image: ${REGISTRY:-registry.digitalocean.com/future-advisor}/api:${API_TAG:-${IMAGE_TAG:-latest}}
    container_name: fa-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: "4000"
      API_CORS_ORIGIN: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN in .env (e.g. https://your-domain)}
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@timescaledb:5432/${POSTGRES_DB}?schema=public"
      REDIS_URL: redis://redis:6379/0
      FORECAST_SERVICE_URL: http://forecast-py:8000
      FORECAST_SERVICE_TOKEN: ${FORECAST_SERVICE_TOKEN:?set FORECAST_SERVICE_TOKEN in .env}
      AGENT_API_URL: http://forecast-agent:8020
      AGENT_API_TOKEN: ${AGENT_API_TOKEN}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_EXPIRES_IN: 8h
      GOLD_SCHEMA: gold
      # Required by the API env schema; flagged services will no-op.
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-not-deployed}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-not-deployed}
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://10.141.5.182:4000/health').then(r=>r.json()).then(j=>process.exit(j.db?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    mem_limit: 512m
    networks: [fa_internal]
    logging: *logging

  web:
    image: ${REGISTRY:-registry.digitalocean.com/future-advisor}/web:${WEB_TAG:-${IMAGE_TAG:-latest}}
    container_name: fa-web
    restart: unless-stopped
    environment:
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_GRAPHQL_URL: /graphql
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://10.141.5.182:3000/login').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    mem_limit: 384m
    networks: [fa_internal]
    logging: *logging

  forecast-py:
    image: ${REGISTRY:-registry.digitalocean.com/future-advisor}/forecast-py:${FORECAST_PY_TAG:-${IMAGE_TAG:-latest}}
    container_name: fa-forecast-py
    restart: unless-stopped
    environment:
      DATABASE_URL: *database-url
      FORECAST_SERVICE_TOKEN: ${FORECAST_SERVICE_TOKEN}
      API_GRAPHQL_URL: http://api:4000/graphql
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
    depends_on:
      timescaledb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://10.141.5.182:8000/health', timeout=10).status == 200 else 1)"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 20s
    mem_limit: 1g
    networks: [fa_internal]
    logging: *logging

  forecast-agent:
    image: ${REGISTRY:-registry.digitalocean.com/future-advisor}/forecast-agent:${FORECAST_AGENT_TAG:-${IMAGE_TAG:-latest}}
    container_name: fa-forecast-agent
    restart: unless-stopped
    command: ["fa-agent", "serve-api"]
    environment: *agent-env
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://10.141.5.182:8020/health', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    mem_limit: 512m
    networks: [fa_internal]
    logging: *logging

  forecast-scheduler:
    # Same image as forecast-agent; scheduler loop + market news + Agent Rashid.
    image: ${REGISTRY:-registry.digitalocean.com/future-advisor}/forecast-agent:${FORECAST_AGENT_TAG:-${IMAGE_TAG:-latest}}
    container_name: fa-forecast-scheduler
    restart: unless-stopped
    command: ["fa-agent", "serve-scheduler"]
    environment: *agent-env
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
      forecast-agent:
        condition: service_started
    mem_limit: 384m
    networks: [fa_internal]
    logging: *logging

  ingest-worker:
    image: ${REGISTRY:-registry.digitalocean.com/future-advisor}/ingest-worker:${INGEST_TAG:-${IMAGE_TAG:-latest}}
    container_name: fa-ingest-worker
    restart: unless-stopped
    command: ["celery", "-A", "ingest.celery_app", "worker", "-Q", "ingest", "-c", "2", "--loglevel=info"]
    environment:
      DATABASE_URL: *database-url
      REDIS_URL: redis://redis:6379/0
      GOLD_SCHEMA: ${GOLD_SCHEMA:-gold}
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 768m
    networks: [fa_internal]
    logging: *logging

  ingest-beat:
    image: ${REGISTRY:-registry.digitalocean.com/future-advisor}/ingest-worker:${INGEST_TAG:-${IMAGE_TAG:-latest}}
    container_name: fa-ingest-beat
    restart: unless-stopped
    command: ["celery", "-A", "ingest.celery_app", "beat", "--loglevel=info"]
    environment:
      DATABASE_URL: *database-url
      REDIS_URL: redis://redis:6379/0
      GOLD_SCHEMA: ${GOLD_SCHEMA:-gold}
    depends_on:
      redis:
        condition: service_healthy
      ingest-worker:
        condition: service_started
    mem_limit: 256m
    networks: [fa_internal]
    logging: *logging

  live-agent:
    image: ${REGISTRY:-registry.digitalocean.com/future-advisor}/live-agent:${LIVE_AGENT_TAG:-${IMAGE_TAG:-latest}}
    container_name: fa-live-agent
    restart: unless-stopped
    environment:
      DATABASE_URL: *database-url
      REDIS_URL: redis://redis:6379/0
      TE_HONOR_TOS: "1"
      SOURCES_ENABLED: ${SOURCES_ENABLED:-yahoo,fred,te_uae,te_matrix}
      TE_FETCH_INTERVAL_SEC: "600"
      WRITE_REDIS: "1"
      WRITE_POSTGRES: "1"
      FRED_API_KEY: ${FRED_API_KEY:-}
      TE_USER_AGENT: ${TE_USER_AGENT:-FutureAdvisor/1.0 (ops@example.com)}
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 256m
    networks: [fa_internal]
    logging: *logging

  synthea-agent:
    image: ${REGISTRY:-registry.digitalocean.com/future-advisor}/synthea-agent:${SYNTHEA_TAG:-${IMAGE_TAG:-latest}}
    container_name: fa-synthea-agent
    restart: unless-stopped
    environment:
      - APP_HOST=0.0.0.0
      - APP_PORT=8001
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - LLM_PROVIDER=${CHAT_LLM_PROVIDER:-ollama}
      - LLM_MODEL=${CHAT_LLM_MODEL:-qwen3:4b-instruct-2507-q4_K_M}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen3:4b-instruct-2507-q4_K_M}
      - CYPHER_MODEL=${CYPHER_MODEL:-futureadvisor-cypher:latest}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-user_provided}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - BATCH_SIZE=5000
      - GUARDRAILS_ENABLED=true
      - GUARDRAILS_REDACT_OUTPUT=true
      - CYPHER_ROW_LIMIT=100
      - CYPHER_TIMEOUT=15
      - MEMORY_ENABLED=true
      - CACHE_ENABLED=true
      - SCHEMA_VERSION=v2
      - REDIS_URL=redis://redis:6379/1
      - SESSION_TTL=86400
      - CACHE_TTL=86400
      - HYBRID_RETRIEVER_ENABLED=false
    depends_on:
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data_dictionary.yaml:/app/metadata/data_dictionary.yaml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    mem_limit: 1g
    networks: [fa_internal]
    logging: *logging

  librechat:
    image: ${REGISTRY:-registry.digitalocean.com/future-advisor}/librechat:${LIBRECHAT_TAG:-${IMAGE_TAG:-latest}}
    container_name: fa-librechat
    restart: unless-stopped
    environment:
      - HOST=0.0.0.0
      - PORT=3080
      - MONGO_URI=mongodb://mongodb:27017/LibreChat
      - MEILI_HOST=http://meilisearch:7700
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
      - SEARCH=true
      - AGENT_API_URL=http://synthea-agent:8001
      - AGENTS_ENABLED=true
      - TITLE_CONVO=true
      - ARTIFACTS_ENABLED=true
      - ALLOW_REGISTRATION=${ALLOW_REGISTRATION:-true}
      - ALLOW_EMAIL_LOGIN=${ALLOW_EMAIL_LOGIN:-true}
      - JWT_SECRET=${LIBRECHAT_JWT_SECRET:?set LIBRECHAT_JWT_SECRET in .env}
      - JWT_REFRESH_SECRET=${LIBRECHAT_JWT_REFRESH_SECRET:?set LIBRECHAT_JWT_REFRESH_SECRET in .env}
      - CREDS_KEY=${CREDS_KEY:?set CREDS_KEY in .env}
      - CREDS_IV=${CREDS_IV:?set CREDS_IV in .env}
    depends_on:
      mongodb:
        condition: service_healthy
      synthea-agent:
        condition: service_started
    volumes:
      - ./librechat.yaml:/app/librechat.yaml:ro
      - librechat_images:/app/client/public/images
      - librechat_uploads:/app/uploads
      - librechat_logs:/app/logs
    mem_limit: 512m
    networks: [fa_internal]
    logging: *logging

  # ─────────────────────────────── proxy ────────────────────────────────

  proxy:
    image: caddy:2-alpine
    container_name: fa-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "4000:4000"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    mem_limit: 128m
    networks: [fa_internal]
    logging: *logging

networks:
  fa_internal:
    name: future-advisor-full_internal

volumes:
  timescale_data:
  redis_data:
  neo4j_data:
  neo4j_logs:
  mongo_data:
  meili_data:
  librechat_images:
  librechat_uploads:
  librechat_logs:
  caddy_data:
  caddy_config:
