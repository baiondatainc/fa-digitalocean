version: 1.3.12
cache: true

interface:
  artifacts: true
  openArtifactsByDefault: true
  endpointsMenu: true
  modelSelect: true
  parameters: true
  sidePanel: true
  presets: true

endpoints:
  agents:
    titleConvo: true
    titleMethod: "completion"
    titleModel: "current_model"

  custom:
    # DoF Knowledge Graph agent — service name on the shared docker network
    - name: "DOF-KG"
      apiKey: "dummy-key"
      baseURL: "http://synthea-agent:8001/v1"
      models:
        default: ["DOF-kg"]
        fetch: false
      titleConvo: true
      titleMethod: "completion"
      titleModel: "DOF-kg"
      headers:
        X-Conversation-ID: "{{LIBRECHAT_BODY_CONVERSATIONID}}"
        X-Message-ID: "{{LIBRECHAT_BODY_MESSAGEID}}"
      modelDisplayLabel: "Department of Finance Knowledge Graph"
      dropParams: ["stop", "user", "frequency_penalty", "presence_penalty"]
